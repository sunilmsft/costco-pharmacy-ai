<!doctype html>
<html lang="en">
<head>

    <title>Guided Pharmacy Care</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;

        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            width: min(680px, calc(100% - 40px));
            padding: 48px;
            background: #ffffff;
            border: 1px solid #dce8f0;

            box-shadow: 0 16px 40px rgba(24, 50, 71, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            color: #005daa;
            font-size: clamp(30px, 5vw, 46px);
        }

        p {
            margin: 0 0 28px;
            font-size: 18px;
            line-height: 1.5;
        }

        nav {
            display: grid;
            gap: 12px;
        }

        a {
            display: block;
            padding: 15px 18px;
            border-radius: 10px;
            background: #005daa;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: #00477f;
        }

        small {
            display: block;
            margin-top: 28px;
            color: #5a7085;
            line-height: 1.5;
        }

    <main>
